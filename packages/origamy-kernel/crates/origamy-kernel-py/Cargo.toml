[package]
name = "origamy-kernel-py"
description = "Python bindings of origamy-kernel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "origamy_kernel_py"
crate-type = ["cdylib"]
# An extension module links against Python only when Python loads it, so it has no test binary.
test = false
doctest = false

[dependencies]
num-bigint.workspace = true
origamy-kernel.workspace = true
pyo3 = { workspace = true, features = ["num-bigint"] }

[lints]
workspace = true
