[project]
name = "origamy"
version = "0.0.0"
description = "A compiler for origami, built for AI agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Maxence Faldor" }]
keywords = ["origami", "ai-agents", "compiler", "simulator", "crease-pattern", "fold"]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = [
    "numpy>=2.3",
    "playwright>=1.64",
    "pydantic>=2.14",
    "pydantic-settings>=2.15",
]

[project.urls]
Source = "https://github.com/maxencefaldor/origamy"
Issues = "https://github.com/maxencefaldor/origamy/issues"

[project.scripts]
origamy = "origamy.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
