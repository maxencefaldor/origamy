name: Probe

on:
  pull_request:

jobs:
  probe:
    name: Fingerprint on a runner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        run: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: uv sync
      - name: Fingerprint
        run: |
          lscpu | grep "Model name"
          uv run python probe/bits.py
          uv run python probe/move.py "inside reverse" 1.0
