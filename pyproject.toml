[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
origamy = { workspace = true }
origamy-mcp = { workspace = true }

# uv.lock pins every version; `uv lock --upgrade` moves them all to the newest releases.
[dependency-groups]
dev = [
  "hypothesis",
  "origamy",
  "origamy-mcp",
  "pytest",
  "pytest-github-actions-annotate-failures",
  "rumdl",
  "ruff",
  "ty",
]

[tool.ruff]
# The workspace root has no [project] table, so ruff cannot read requires-python here.
target-version = "py314"
src = ["packages/origamy/src", "packages/origamy-mcp/src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # the formatter places trailing commas itself
  # pydantic reads annotations at runtime, so an import used only in an annotation is still a
  # runtime import, and origamy writes no TYPE_CHECKING blocks.
  "TC",
]

[tool.ruff.lint.per-file-ignores]
# pytest checks with assert and imports test folders by path; a test's name says what it checks,
# and the values it expects are its content.
"**/tests/**" = ["D100", "D103", "INP001", "PLR2004", "S101"]
# Fold scripts are models written as code: their numbers are the model, and they run as scripts,
# outside any package.
"examples/**" = ["INP001", "PLR2004"]
"packages/*/src/*/cli.py" = ["T201"] # a command line prints

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.14" # the oldest Python origamy supports

[tool.ty.rules]
all = "error"

[tool.pytest]
testpaths = ["packages"]
addopts = [
  "--import-mode=importlib",
  "--doctest-modules",
  "--strict-config",
  "--strict-markers",
  "-ra",
]
filterwarnings = ["error"]
xfail_strict = true
# Expected output in docstrings wraps at 88 columns like the code around it.
doctest_optionflags = ["NORMALIZE_WHITESPACE"]
